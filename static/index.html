<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BitNet Inference</title>
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>

<h1>BitNet b1.58 2B-4T</h1>
<div class="header-actions">
  <a class="download-link" href="/download">Download</a>
  <button type="button" id="info-btn" class="info-btn" title="Show the model configuration in force" aria-haspopup="dialog">&#9432; Config</button>
</div>

<div id="info-modal" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="info-title">
  <div class="modal-card">
    <div class="modal-head">
      <h2 id="info-title">Model configuration</h2>
      <button type="button" id="info-close" class="modal-close" aria-label="Close">&times;</button>
    </div>
    <p class="modal-note">Every setting actually in force on the server, resolved from environment and defaults. Read-only.</p>
    <div id="info-body" class="modal-body">Loading…</div>
  </div>
</div>

<div id="auth-gate" hidden>
  <form id="auth-form">
    <label for="auth-key">This server requires an API key</label>
    <div class="auth-row">
      <input type="password" id="auth-key" placeholder="API key" autocomplete="current-password">
      <button type="submit">Unlock</button>
    </div>
    <p id="auth-error" class="error" hidden></p>
  </form>
</div>

<div id="ui" hidden>

  <details>
    <summary>
      <span>Configuration</span>
      <svg class="chevron" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
    </summary>
    <div class="config-panel">
      <div>
        <label for="system-prompt">System Prompt <span class="hint">(pinned — survives compaction)</span></label>
        <textarea id="system-prompt" rows="2" placeholder="Leave empty to use the server's default prompt (recommended)."></textarea>
      </div>
      <div class="config-grid">
        <div class="field">
          <label for="cfg-temp">Temperature</label>
          <input type="number" id="cfg-temp" value="0.3" min="0" max="2" step="0.1">
          <span class="hint">Randomness</span>
        </div>
        <div class="field">
          <label for="cfg-top-p">Top P</label>
          <input type="number" id="cfg-top-p" value="" min="0" max="1" step="0.05" placeholder="off">
          <span class="hint">Optional; min_p already filters</span>
        </div>
        <div class="field">
          <label for="cfg-max-tokens">Max Tokens</label>
          <input type="number" id="cfg-max-tokens" value="256" min="1" step="1">
          <span class="hint">Max response length</span>
        </div>
        <div class="field">
          <label for="cfg-stop">Stop Sequences</label>
          <input type="text" id="cfg-stop" value="" placeholder="e.g. END, DONE">
          <span class="hint">Comma-separated</span>
        </div>
      </div>
    </div>
  </details>

  <div id="log"></div>

  <div id="ctx-bar-wrap" title="Click to compact context">
    <div id="ctx-bar-bg"><div id="ctx-bar-fill"></div></div>
    <div id="ctx-bar-label">0 tokens</div>
  </div>

  <form id="form">
    <input type="text" id="input" placeholder="Type a message..." autocomplete="off" autofocus>
    <button type="submit" id="btn">Send</button>
    <button type="button" id="stop-btn" hidden>Stop</button>
    <button type="button" id="clear-btn" title="Clear conversation history">Clear</button>
  </form>

</div>

<script src="/static/vendor/marked.min.js"></script>
<script src="/static/vendor/purify.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
